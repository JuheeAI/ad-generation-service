services:
  backend:
    build: .
    container_name: ad-project-backend
    command: uvicorn src.backend.main:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"
    environment:
      - HF_TOKEN=${HF_TOKEN}         
      - OPENAI_API_KEY=${OPENAI_API_KEY} 
      - DATABASE_URL=sqlite:////app/data/database.db 
    volumes:
      - ./data:/app/data              
      - ./hf_cache:/app/cache/huggingface 
      - ./src:/app/src               
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always

  frontend:
    build: .
    container_name: ad-project-frontend
    command: streamlit run src/frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://backend:9000
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
    restart: always